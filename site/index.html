<!doctype html>

        <button class="filter-button" data-filter="travel" type="button">
          旅行足迹

      </nav>

    <footer class="site-footer">
      <div class="page-shell">
        <p>用照片记录生活，让每一刻都有迹可循。</p>
      </div>
    </footer>

    <script>
      const filterButtons = document.querySelectorAll('.filter-button');
      const photoCards = document.querySelectorAll('.photo-card');

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const filter = button.dataset.filter;

          filterButtons.forEach((btn) => btn.classList.remove('is-active'));
          button.classList.add('is-active');

          photoCards.forEach((card) => {
            const visible = filter === 'all' || card.dataset.category === filter;
            card.classList.toggle('is-hidden', !visible);
          });
        });
      });

      photoCards.forEach((card) => {
        const figure = card.querySelector('.photo-card__figure');
        const image = card.querySelector('.photo-card__image');

        card.addEventListener('mousemove', (event) => {
          const rect = figure.getBoundingClientRect();
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateX = ((y - centerY) / centerY) * -8;
          const rotateY = ((x - centerX) / centerX) * 8;

          figure.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-6px)`;
          image.style.transform = `translateZ(30px) scale(1.05)`;
        });

        card.addEventListener('mouseleave', () => {
          figure.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)';
          image.style.transform = 'translateZ(0) scale(1)';
        });
      });
    </script>
  </body>
</html>
